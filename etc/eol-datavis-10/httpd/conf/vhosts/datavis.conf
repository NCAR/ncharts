<VirtualHost *:80>
  ServerAdmin webmaster@eol.ucar.edu
  ServerName datavis.eol.ucar.edu
  ErrorLog /var/log/httpd/datavis.log
  LogLevel info

  RewriteEngine on
  RewriteRule ^/admin(.*) http://127.0.0.1:9000%{REQUEST_URI} [P]
  RewriteRule ^/ncharts(.*) http://127.0.0.1:9000%{REQUEST_URI} [P]

  <Directory /var/django/ncharts>
    Require all granted
  </Directory>

  Alias /media/ /var/django/ncharts/media/
  <Directory /var/django/ncharts/media>
    Require all granted
  </Directory>

  Alias /static/ /var/django/ncharts/static/
  <Directory /var/django/ncharts/static>
    Require all granted
  </Directory>
  <Location "/static/">
      Options -Indexes
  </Location>

  #
  # Redirect /dv2-api* to new domain
  #
  RedirectMatch ^/dv2-api(/.*)?$ https://thp.eol.ucar.edu/dv2-api$1

  #
  # Redirect /time-height-plot* to new domain
  #
  RedirectMatch ^/time-height-plot(/.*)?$ https://thp.eol.ucar.edu/time-height-plot$1
</VirtualHost>
