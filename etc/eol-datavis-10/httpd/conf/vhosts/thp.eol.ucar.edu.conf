# http to https redirect
<VirtualHost *:80>
  ServerName thp.eol.ucar.edu
  Redirect permanent / https://thp.eol.ucar.edu/
</VirtualHost>

# https virtual host
<VirtualHost *:443>
  ServerName thp.eol.ucar.edu

  # SSL Configuration
  SSLEngine on
  #
  # Though specifying fullchain.pem as SSLCertificateFile is frequently
  # specified online and works for some clients, it can lead to "SSL certificate
  # problem: unable to get local issuer certificate" errors in other clients,
  # including Qualsys SSL Labs' analyzer,
  # https://www.ssllabs.com/ssltest/analyze.html?d=thp.eol.ucar.edu&hideResults=on
  # at least when used for InCommon ACME RSA certificates.
  #
  # To mitigate this, specify SSLCertificateChainFile and SSLCertificateFile
  # separately.
  #
  SSLCertificateChainFile /etc/letsencrypt/live/eol-datavis-10.eol.ucar.edu/chain.pem
  SSLCertificateFile /etc/letsencrypt/live/eol-datavis-10.eol.ucar.edu/cert.pem
  SSLCertificateKeyFile /etc/letsencrypt/live/eol-datavis-10.eol.ucar.edu/privkey.pem

  # Modern SSL configuration
  SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
  SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
  SSLHonorCipherOrder off
  SSLSessionTickets off

  # Enable HTTP/2
  Protocols h2 http/1.1

  # Logging
  ErrorLog /var/log/httpd/thp.eol.ucar.edu_error.log
  CustomLog /var/log/httpd/thp.eol.ucar.edu_access.log combined

  # Proxy API requests to Rails backend
  ProxyPreserveHost On
  ProxyPass /dv2-api/ http://127.0.0.1:3003/dv2-api/
  ProxyPassReverse /dv2-api/ http://127.0.0.1:3003/dv2-api/

  # Set headers for API proxy
  ProxyPassReverse /dv2-api/ http://127.0.0.1:3003/dv2-api/
  <Location "/dv2-api/">
    # Forward real IP and protocol headers
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    RequestHeader set X-Forwarded-For expr=%{REMOTE_ADDR}
  </Location>

  # Serve React application
  DocumentRoot /var/www/html/time-height-plot

  Alias /time-height-plot /var/www/html/time-height-plot

  # React Router support - fallback to index.html for client-side routing
  <Directory "/var/www/html/time-height-plot">
    Options -Indexes
    AllowOverride None
    Require all granted

    # Try files, fallback to index.html for React Router
    FallbackResource /time-height-plot/index.html
  </Directory>

  # Cache static assets
  <LocationMatch "\.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$">
    ExpiresActive On
    ExpiresDefault "access plus 1 month"
    Header append Cache-Control "public, immutable"
  </LocationMatch>

  # Security headers
  Header always set X-Content-Type-Options nosniff
  Header always set X-Frame-Options DENY
  Header always set X-XSS-Protection "1; mode=block"
  Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"
  Header always set Referrer-Policy "strict-origin-when-cross-origin"

  # Don't cache HTML files
  <FilesMatch "\.(html|htm)$">
    Header set Cache-Control "no-cache, no-store, must-revalidate"
    Header set Pragma "no-cache"
    Header set Expires 0
  </FilesMatch>
</VirtualHost>
